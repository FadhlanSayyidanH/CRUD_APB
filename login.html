<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Absensi APB</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 400px;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h2 { color: #2c3e50; font-size: 22px; margin-bottom: 6px; }
        .logo p { color: #7f8c8d; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #3498db; }
        .btn-login {
            width: 100%;
            padding: 13px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #2980b9; }
        .btn-login:disabled { background: #95a5a6; cursor: not-allowed; }
        .error-msg {
            margin-top: 15px;
            padding: 10px 14px;
            background: #fde8e8;
            border: 1px solid #e74c3c;
            border-radius: 5px;
            color: #c0392b;
            font-size: 14px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo">
        <h2>Sistem Absensi APB</h2>
        <p>Masuk dengan akun Anda</p>
    </div>
    <form id="login-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Masukkan username" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn-login" class="btn-login">Masuk</button>
    </form>
    <div class="error-msg" id="error-msg">Username atau password salah.</div>
</div>
<script type="module" src="login.js"></script>
</body>
</html>
