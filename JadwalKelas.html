<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Jadwal Kelas</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 40px; background-color: #f5f7fb; }
        .container { max-width: 950px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; background: #fdfdfd; padding: 20px; border: 1px solid #e0e0e0; border-radius: 6px; }
        .form-group { display: flex; gap: 10px; }
        .form-group label { font-size: 13px; color: #7f8c8d; display: block; margin-bottom: 4px; }
        .input-wrapper { flex: 1; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .btn-submit { background-color: #2ecc71; color: white; align-self: flex-end; width: 150px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background-color: #34495e; color: white; }
        .btn-edit { background-color: #3498db; color: white; padding: 5px 10px; border-radius: 3px; border: none; cursor: pointer; }
        .btn-delete { background-color: #e74c3c; color: white; padding: 5px 10px; border-radius: 3px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Manajemen Jadwal Kelas</h2>
    <p style="display: flex; gap: 15px;">
        <a href="index.html">Data Mahasiswa</a> | 
        <a href="Absensi.html">Data Absensi</a> | 
        <a href="#">Data Jadwal Kelas</a>
    </p>
    
    <form id="jadwal-form">
        <div class="form-group">
            <input type="text" id="jk-id" placeholder="Kode Jadwal (Contoh: JK001)" required>
            <input type="text" id="jk-nama" placeholder="Nama Mata Kuliah" required>
            <input type="text" id="jk-prodi" placeholder="Kode Fakultas Prodi (Contoh: 303)" required>
        </div>
        <div class="form-group">
            <input type="text" id="jk-paket" placeholder="Paket MK (Contoh: SMT002)" required>
            <input type="text" id="jk-ruangan" placeholder="Ruangan (Contoh: KU1.02.02)" required>
            
            <div class="input-wrapper">
                <label for="jk-waktu-masuk">Waktu Masuk</label>
                <input type="datetime-local" id="jk-waktu-masuk" required>
            </div>
            <div class="input-wrapper">
                <label for="jk-waktu-selesai">Waktu Selesai</label>
                <input type="datetime-local" id="jk-waktu-selesai" required>
            </div>
        </div>
        <button type="submit" id="btn-action" class="btn-submit">Simpan Jadwal</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Kode</th>
                <th>Nama Mata Kuliah</th>
                <th>Kode Prodi</th>
                <th>Paket MK</th>
                <th>Ruangan</th>
                <th>Jadwal Masuk</th>
                <th>Jadwal Selesai</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="jadwal-table-body">
        </tbody>
    </table>
</div>

<script type="module" src="jadwal.js"></script>
</body>
</html>
