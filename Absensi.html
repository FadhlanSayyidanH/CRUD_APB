<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Absensi Mahasiswa</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f5f7fb; }
        .navbar {
            background: #2c3e50;
            color: white;
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar-brand { font-size: 18px; font-weight: 700; }
        .navbar-right { display: flex; align-items: center; gap: 14px; font-size: 14px; }
        .nav-links { display: flex; gap: 6px; align-items: center; }
        .nav-links a {
            color: #bdc3c7;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            transition: background 0.2s, color 0.2s;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-links a.active { background: #3498db; color: white; }
        .nav-sep { color: #4a6278; }
        .btn-logout {
            padding: 7px 16px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-logout:hover { background: #c0392b; }
        .container { max-width: 900px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        form { display: flex; gap: 12px; margin-bottom: 30px; background: #fdfdfd; padding: 20px; border: 1px solid #e0e0e0; border-radius: 6px; align-items: center; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .input-text { flex: 2; }
        select { flex: 1.5; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .btn-submit { background-color: #2ecc71; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background-color: #34495e; color: white; }
        .btn-edit { background-color: #3498db; color: white; padding: 5px 10px; border-radius: 3px; border: none; cursor: pointer; }
        .btn-delete { background-color: #e74c3c; color: white; padding: 5px 10px; border-radius: 3px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">Sistem Absensi APB</div>
    <div class="navbar-right">
        <div class="nav-links">
            <a href="index.html">Data Mahasiswa</a>
            <span class="nav-sep">|</span>
            <a href="Absensi.html" class="active">Data Absensi</a>
            <span class="nav-sep">|</span>
            <a href="JadwalKelas.html">Data Jadwal Kelas</a>
            <span class="nav-sep">|</span>
            <a href="DataDosen.html">Data Dosen</a>
        </div>
        <span id="nav-username" style="font-size:13px;color:#bdc3c7;"></span>
        <button class="btn-logout" id="btn-logout">Logout</button>
    </div>
</nav>

<div class="container">
    <h2>Pencatatan Absensi Mahasiswa</h2>

    <form id="absensi-form">
        <input type="hidden" id="absensi-id">
        <input type="text" id="abs-nim" class="input-text" placeholder="NIM Mahasiswa" required>
        <input type="text" id="abs-kodemk" class="input-text" placeholder="Kode MK (Contoh: JK001)" required>
        <select id="abs-status" required>
            <option value="" disabled selected>Pilih Status</option>
            <option value="Hadir">Hadir</option>
            <option value="Sakit">Sakit</option>
            <option value="Izin">Izin</option>
            <option value="Alfa">Alfa</option>
        </select>
        <button type="submit" id="btn-action" class="btn-submit">Submit Absen</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>NIM</th>
                <th>Kode MK</th>
                <th>Status Kehadiran</th>
                <th>Waktu Absen</th>
                <th style="width: 150px;">Aksi</th>
            </tr>
        </thead>
        <tbody id="absensi-table-body">
        </tbody>
    </table>
</div>

<script type="module" src="absensi.js"></script>
</body>
</html>
